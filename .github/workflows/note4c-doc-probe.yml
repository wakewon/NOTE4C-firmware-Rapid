name: NOTE4C official build dependency probe

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/note4c-doc-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official NOTE4C quick-start and inspect dependency instructions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import re
          import urllib.parse
          import urllib.request

          url = 'https://wiki.zectrix.com/zh/hardware/note4c/quick-start'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read().decode('utf-8', 'replace')
          print('HTML bytes:', len(raw))

          text = html.unescape(re.sub(r'<[^>]+>', '\n', raw))
          keys = ('依赖', '编译', 'ESP-IDF', 'managed_components', 'component', '下载', 'idf.py', 'git clone')
          lines = [re.sub(r'\s+', ' ', x).strip() for x in text.splitlines()]
          hits = [x for x in lines if x and any(k.lower() in x.lower() for k in keys)]
          print('\n=== HTML text hits ===')
          for x in hits[:200]: print(x[:1200])

          attrs = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', raw)
          assets = []
          for p in attrs:
              u = urllib.parse.urljoin(url, p)
              if urllib.parse.urlparse(u).netloc == 'wiki.zectrix.com' and ('.js' in u or '.mjs' in u):
                  assets.append(u)
          print('\n=== JS assets ===')
          for u in assets: print(u)

          print('\n=== JS dependency-context hits ===')
          seen = set()
          for u in assets:
              if u in seen: continue
              seen.add(u)
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      js = r.read().decode('utf-8', 'replace')
              except Exception as e:
                  print('FETCH ERROR', u, e)
                  continue
              for key in keys:
                  pos = 0
                  while True:
                      i = js.lower().find(key.lower(), pos)
                      if i < 0: break
                      a, b = max(0, i-800), min(len(js), i+1800)
                      snippet = re.sub(r'\s+', ' ', html.unescape(js[a:b]))
                      print(f'[{key}] {u}\n{snippet[:2600]}\n---')
                      pos = i + len(key)
          PY
