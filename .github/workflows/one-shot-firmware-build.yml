name: Build NOTE4C firmware

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pinned ESP-IDF
        shell: bash
        run: |
          set -euo pipefail
          echo "IDF_PATH=${IDF_PATH:-}"
          idf.py --version
          grep -A3 '^  idf:$' firmware/dependencies.lock

      - name: Build and package firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 firmware/scripts/package.py --clean

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware-artifacts
          test -s firmware/build/merged-binary.bin
          test -s firmware/build/xiaozhi.bin
          cp firmware/build/merged-binary.bin firmware-artifacts/NOTE4C-full.bin
          cp firmware/build/xiaozhi.bin firmware-artifacts/NOTE4C-app.bin
          sha256sum firmware-artifacts/NOTE4C-full.bin firmware-artifacts/NOTE4C-app.bin \
            > firmware-artifacts/SHA256SUMS.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NOTE4C-dev-firmware
          path: firmware-artifacts/
          if-no-files-found: error
          retention-days: 7
